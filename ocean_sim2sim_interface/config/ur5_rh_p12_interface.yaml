# ocean_sim2sim_interface settings for UR5 + RH-P12-RN.
# Values follow the Isaac Sim interface (data_collection_ur5_gripper isaacsim/config/ros2_iface.yaml,
# drive_gains.yaml) and the real rh_gripper_node, so recordings / policies see the same topics.
ocean_sim2sim_interface:
  ros__parameters:
    use_sim_time: true
    publish_queue_sec: 3.0             # RELIABLE queue depth = this x topic rate (Isaac Sim: 3 s)
    physics_hz: 240.0                  # Gazebo physics rate (empty_ocean.sdf), must be a multiple of loop_hz
    # Loop = Isaac Sim app loop (one render, 30 Hz): gripper states, then commands, once per loop tick.
    loop_tick_topic: /cam/wrist/color/camera_info   # tick on every wrist camera frame (same stamps as the images).
                                                    #   "" = no camera: tick every physics_hz / loop_hz steps
    loop_hz: 30.0                      # loop rate without a camera (and queue depth of the gripper topics)
    commands_on_loop: true             # true = apply /joint_command, /gripper/command once per loop (last wins), like
                                       #   Isaac Sim (up to 33 ms wait). false = apply on arrival
    state_topic: /joint_state_broadcaster/joint_states   # all joints (arm + fingers), every physics step

    arm:
      joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
      joint_command_topic: /joint_command
      trajectory_topic: /arm_controller/joint_trajectory
      command_interp_time: 0.033333    # [s] linear interpolation to each new command (Isaac Sim ArmBridge)

    gripper:
      joint: rh_r1_joint
      name: rh_p12_rn                  # JointState name on /gripper/joint_states, /gripper/target
      raw_max: 1150.0                  # raw 0 (open) ~ 1150 (closed), real gripper node
      upper: 1.13514578304             # [rad] rh_r1_joint at raw_max (URDF limit)
      profile_velocity: 0.516          # [rad/s] = 1.1351 rad / 2.2 s (real close / open ~2.2 s)
      command_margin: 0.001            # [rad] Gazebo only: keep the joint target this far inside the limits
                                       #   (a joint driven exactly onto its limit gets stuck in DART)
      command_topic: /gripper/command
      joint_states_topic: /gripper/joint_states
      target_topic: /gripper/target
      trajectory_topic: /gripper_controller/joint_trajectory

# Episode scene (scene_node): the drone to grasp. Same drone position as Isaac Sim (scene_drone.yaml drone_pos,
# robot base frame = world - table top 0.762): the under_drone start pose sees it at the wrist image centre.
ocean_sim2sim_scene:
  ros__parameters:
    use_sim_time: true
    boat_model: wamv
    boat_link: wamv/base_link
    robot_base_link: robot_mount       # arm root link; drone positions are given in its (level) frame
    drone_pos_base: [0.60, 0.0, 0.738] # [m] robot base frame (x forward, y left, z up), level
    spawn_delay: 3.0                   # [s sim] wait for the boat to settle after start
    base_average: 5.0                  # [s sim] average the robot base pose over this (about one wave period, 5 s)
                                       #   before placing the drone: the drone is world-fixed, the boat moves

    # /sim/reset (Isaac Sim sim_reset + scene_drone.yaml)
    arm_joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    init_pose: [-0.1889, -1.0776, 1.7304, -2.2242, 1.5700, -2.9566]   # Isaac Sim init_poses.under_drone [rad]
    gripper_joint: rh_r1_joint
    gripper_open: 0.001                # [rad] reset opens to here (exactly 0 = on the limit: stuck in DART)
    reset_arm_time: 2.0                # [s sim] arm to init_pose, gripper open (smooth: no joint teleport from ROS)
    seed: -1                           # -1 = start time (different every session). Same seed = same drone sequence
    drone_offset: 0.03                 # [m] uniform +- per axis around the chosen point (Isaac Sim reset.drone_offset)
    use_drone_targets: true            # true: points below, shuffled, one round at a time (Isaac Sim --drone-targets)
                                       # false: drone_pos_base
    # Isaac Sim drone_targets_base (robot base frame [m]): name = base cm, e.g. x45_y-20_z70 = (0.45, -0.20, 0.70)
    drone_target_names: [x45_y-20_z70, x45_y-10_z70, x45_y+00_z70, x45_y+10_z70, x45_y+20_z70, x55_y-20_z70, x55_y-10_z70, x55_y+00_z70, x55_y+10_z70, x55_y+20_z70, x65_y-20_z70, x65_y-10_z70, x65_y+00_z70, x65_y+10_z70, x65_y+20_z70, x45_y-20_z80, x45_y-10_z80, x45_y+00_z80, x45_y+10_z80, x45_y+20_z80, x55_y-20_z80, x55_y-10_z80, x55_y+00_z80, x55_y+10_z80, x55_y+20_z80]
    drone_targets_base: [
      0.45, -0.20, 0.70,   # x45_y-20_z70
      0.45, -0.10, 0.70,   # x45_y-10_z70
      0.45, 0.00, 0.70,   # x45_y+00_z70
      0.45, 0.10, 0.70,   # x45_y+10_z70
      0.45, 0.20, 0.70,   # x45_y+20_z70
      0.55, -0.20, 0.70,   # x55_y-20_z70
      0.55, -0.10, 0.70,   # x55_y-10_z70
      0.55, 0.00, 0.70,   # x55_y+00_z70
      0.55, 0.10, 0.70,   # x55_y+10_z70
      0.55, 0.20, 0.70,   # x55_y+20_z70
      0.65, -0.20, 0.70,   # x65_y-20_z70
      0.65, -0.10, 0.70,   # x65_y-10_z70
      0.65, 0.00, 0.70,   # x65_y+00_z70
      0.65, 0.10, 0.70,   # x65_y+10_z70
      0.65, 0.20, 0.70,   # x65_y+20_z70
      0.45, -0.20, 0.80,   # x45_y-20_z80
      0.45, -0.10, 0.80,   # x45_y-10_z80
      0.45, 0.00, 0.80,   # x45_y+00_z80
      0.45, 0.10, 0.80,   # x45_y+10_z80
      0.45, 0.20, 0.80,   # x45_y+20_z80
      0.55, -0.20, 0.80,   # x55_y-20_z80
      0.55, -0.10, 0.80,   # x55_y-10_z80
      0.55, 0.00, 0.80,   # x55_y+00_z80
      0.55, 0.10, 0.80,   # x55_y+10_z80
      0.55, 0.20, 0.80,   # x55_y+20_z80
    ]
