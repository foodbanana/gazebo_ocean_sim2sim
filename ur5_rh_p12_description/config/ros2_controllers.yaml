# ros2_control controllers for UR5 + RH-P12-RN (used with ur5_rh_p12.ros2_control.xacro)
#
#   arm_controller     : 6 arm joints, absolute joint positions [rad]  (std_msgs/Float64MultiArray on /arm_controller/commands)
#   gripper_controller : rh_r1_joint [rad], 0 (open) ~ 1.1351 (closed) (std_msgs/Float64MultiArray on /gripper_controller/commands)
#   joint_state_broadcaster : /joint_states (arm 6 + gripper 4)
controller_manager:
  ros__parameters:
    update_rate: 250  # [Hz] = Gazebo physics step 4 ms

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: forward_command_controller/ForwardCommandController

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: position

gripper_controller:
  ros__parameters:
    joints:
      - rh_r1_joint
    interface_name: position

# gz_ros2_control (Gazebo only): position command -> joint velocity = gain * error * update_rate.
#   0.1 (default): 50 Hz staircase-sine tracking latency 38 ms, RMS 1.55 deg
#   0.15         : latency 26-30 ms, RMS 1.06 deg  <- middle of the Isaac Sim drive tuning result (19-34 ms, 0.7-1.3 deg)
#   0.2          : latency 22 ms, RMS 0.85 deg
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 0.15
