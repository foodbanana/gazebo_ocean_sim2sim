# ocean_sim2sim_interface settings for UR5 + RH-P12-RN.
# Values follow the Isaac Sim interface (data_collection_ur5_gripper isaacsim/config/ros2_iface.yaml,
# drive_gains.yaml) and the real rh_gripper_node, so recordings / policies see the same topics.
ocean_sim2sim_interface:
  ros__parameters:
    use_sim_time: true
    publish_queue_sec: 3.0             # RELIABLE queue depth = this x topic rate (Isaac Sim: 3 s)
    physics_hz: 240.0                  # Gazebo physics rate (empty_ocean.sdf), must be a multiple of gripper.publish_hz
    command_loop_hz: 30.0              # apply /joint_command and /gripper/command once per 30 Hz loop like Isaac Sim
                                       #   (its app loop: up to 33 ms wait, last command of a loop wins). 0 = on arrival
    state_topic: /joint_state_broadcaster/joint_states   # all joints (arm + fingers), every physics step

    arm:
      joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
      joint_command_topic: /joint_command
      trajectory_topic: /arm_controller/joint_trajectory
      command_interp_time: 0.033333    # [s] linear interpolation to each new command (Isaac Sim ArmBridge)

    gripper:
      joint: rh_r1_joint
      name: rh_p12_rn                  # JointState name on /gripper/joint_states, /gripper/target
      raw_max: 1150.0                  # raw 0 (open) ~ 1150 (closed), real gripper node
      upper: 1.13514578304             # [rad] rh_r1_joint at raw_max (URDF limit)
      profile_velocity: 0.516          # [rad/s] = 1.1351 rad / 2.2 s (real close / open ~2.2 s)
      publish_hz: 30.0                 # /gripper/joint_states, /gripper/target (every 8th physics step)
      command_margin: 0.001            # [rad] Gazebo only: keep the joint target this far below the limit
                                       #   (a joint driven exactly onto its limit gets stuck in DART)
      command_topic: /gripper/command
      joint_states_topic: /gripper/joint_states
      target_topic: /gripper/target
      trajectory_topic: /gripper_controller/joint_trajectory
