# Simple drone to grasp (stand-in until the PX4 SITL drone).
# Same values as the Isaac Sim drone (data_collection_ur5_gripper isaacsim/config/drone_simple.yaml):
# small folding quadcopter, 0.8 kg, the gripper approaches from below and closes across the body width (y).
#
# scripts/build_simple_drone.py turns this into models/simple_drone/model.sdf (one rigid body,
# collision shapes = visual shapes, mass per shape).
# Body frame: origin = body box centre, +x forward, +y left, +z up. m, kg.

mass: 0.8            # total

body:
  size: [0.18, 0.08, 0.07]   # length (x), width (y, grasp direction), height (z). width < gripper max opening (~107 mm)
  color: [0.45, 0.45, 0.48]

# arms: flat boxes from the body sides (inset from the front / back ends) to the motors at (+-motor_x, +-motor_y)
arms:
  motor_x: 0.10
  motor_y: 0.12
  inset: 0.02
  z: 0.02                    # arm centre height
  width: 0.018
  thickness: 0.012
  mass: 0.010                # each
  color: [0.35, 0.35, 0.38]

motors:
  radius: 0.014
  height: 0.022              # up from the arm centre
  mass: 0.040
  color: [0.15, 0.15, 0.15]

rotors:                      # propeller discs
  radius: 0.065
  thickness: 0.003
  gap: 0.004                 # motor top to disc
  mass: 0.005
  color: [0.1, 0.1, 0.1]

legs:                        # under the motors, bottom end `clearance` below the body bottom
  radius: 0.004
  clearance: 0.010
  mass: 0.005
  color: [0.2, 0.2, 0.2]

# body box mass = mass - 4 x (arm + motor + rotor + leg)
